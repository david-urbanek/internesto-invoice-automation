[project]
name = "internesto-invoice-automation"
version = "0.1.0"
description = "Kategorizace bankovních transakcí pomocí Gemini API"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "qrcode[pil]>=8.2",
    "qrplatba>=1.2.0",
    "rich>=13.0.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.27.2.3",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.53.0",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
]

[project.scripts]
kategorizace = "kategorizace:main"
konfigurace = "kategorizace.konfigurace:main"
report = "kategorizace.report:main"
evaluace = "kategorizace.evaluace:main"
radky = "kategorizace.radky:main"
nahraj-na-drive = "kategorizace.drive:main"
promazat-vypisy = "kategorizace.promazani:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
